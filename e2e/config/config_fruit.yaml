name: alfred

out_dir: "./real_results/LLM_Planner_No_Vision/"
debug: False # Used to debug a single task. Modify the line mentioned by NOTE in src/run_eval.py
save_results: True  # Enable saving results for debugging
num_workers: 1

llm_planner:
  engine: "Qwen/Qwen3-VL-8B-Instruct"  # Specify the LLM engine to use
  is_thor: False
  vision: False
  dynamic: True
  max_retries: 1  # Maximum number of retries per action
  max_replanning: 5  # Maximum number of dynamic replanning attempts per task
  knn_dataset_path: "src/knn_set_fruit.pkl"
  emb_model_name: "paraphrase-MiniLM-L6-v2"
  num_in_context_examples: 9
  use_mmr: False  # Whether to use Maximal Marginal Relevance for selecting in-context examples
  mmr_lambda: 0.8  # Lambda parameter for MMR (between 0 and 1)
  use_step_instructions: False  # Set to False to disable step instructions
  use_objects: True  # If False, pass an empty list for visible objects in curr_task
  use_failure_reason: False  # If False, skip VLM failure-reason generation on failed actions
  obj_sim_threshold: 0.8  # Threshold for fuzzy object matching (0.0 to 1.0)
  debug: True
  planner: "llm"
  mode: "action_prob"
  confidence_threshold: 1.0
  max_question_iterations: 5
  info_gain_metric: "KL_divergence"
  valid_objects_set: "config/fruit_objects.yaml"


alfred:
  env_args:
    data: alfred/data/json_2.1.0
    pframe: 300
    fast_epoch: false
    reward_config: alfred/models/config/rewards.json
    max_steps: 1000
    pp_folder: pp
  x_display: '1'
  eval_set: 'valid_unseen'  # valid_seen, valid_unseen
  splits: alfred/data/splits/oct21.json
